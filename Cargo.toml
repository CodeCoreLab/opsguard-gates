[package]
name = "opsguard-gates"
version = "0.6.0"
edition = "2021"
description = "OpsGuard 闸门与审计模块（开源版：零硬闸门，可插拔 ActionGate + 审计哈希链 + 可选自更新 + 内置 MCP stdio 服务器）"
license = "MIT OR Apache-2.0"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MCP 服务器二进制（可选特性，默认开启；`--no-default-features` 得到纯库）
[features]
default = ["mcp-server"]
mcp-server = []

[[bin]]
name = "opsguard-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["mcp-server"]
